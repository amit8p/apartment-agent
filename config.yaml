# ===== הגדרות סוכן הדירות =====
# שימי לב: אם הריפו ב-GitHub ציבורי, הקובץ הזה גלוי לכולם - אל תכתבי כאן פרטים אישיים.

# 1) חיפושים ביד2
# הלינק הזה כבר מכוון לשכירות בתל אביב. מומלץ להחליף בלינק משלך:
# yad2.co.il > נדל"ן > השכרה > תל אביב, עד 7,500, 2+ חדרים,
# ממיינים לפי "תאריך - מהחדש לישן" (חשוב!) ומעתיקים את הכתובת מהדפדפן.
yad2_searches:
  - name: "תל אביב"
    url: "https://www.yad2.co.il/realestate/rent/tel-aviv-area?area=1&city=5000&minRooms=2&maxPrice=7500"

# 2) סינון בסיסי
filters:
  min_price: 0
  max_price: 7500
  skip_no_price: false
  min_rooms: 2
  max_rooms: 0
  min_sqm: 0
  exclude_agency: false

  # לעולם לא - נבדק בשם השכונה, ברחוב ובכל הטקסט של המודעה
  exclude_neighborhoods:
    - "נווה שאנן"
    - "נוה שאנן"

  # רק השכונות האלה (מרכז העיר). דירות בשכונות אחרות לא יישלחו
  neighborhoods:
    - "לב תל אביב"        # רוטשילד, הבימה, נחלת בנימין, קינג ג'ורג', כיכר מסריק
    - "לב העיר"
    - "הצפון הישן"
    - "כרם התימנים"
    - "נווה צדק"
    - "נוה צדק"
  must_include_any: []
  exclude_keywords:
    - "שותפים"
    - "שותף"
    - "סאבלט"

# 3) עדיפות - דירות בשכונות האלה נשלחות ראשונות ומסומנות ב-⭐
priority_neighborhoods:
  - "לב תל אביב"
  - "לב העיר"
  - "הצפון הישן"
  - "כרם התימנים"
  - "נווה צדק"
  - "נוה צדק"

# 4) חניה: חניה בדירה, או לפחות אפשרות לתו חניה
#    עם חניה > "🅿️ חניה בדירה"
#    בלי חניה > נשלחת עם תזכורת לוודא תו חניה
#    כתוב במודעה שאין זכאות לתו > לא נשלחת
parking:
  required: true

# 5) דירה מוארת
#    strict: false > כל דירה נשלחת. אם כתוב שהיא מוארת היא מקבלת "☀️ מוארת"
#    strict: true  > רק מודעות שכתוב בהן במפורש שהדירה מוארת (יפספס דירות טובות!)
brightness:
  strict: false
  exclude_words:
    - "מרתף"
    - "חשוכה"

# 6) התראה גם כשדירה שכבר ראית מורידה מחיר
alert_price_drops: true
